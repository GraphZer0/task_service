name: SpotBugs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  spotbugs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compile sources
        run: mvn -B compile --no-transfer-progress

      - name: Run SpotBugs
        run: mvn -B spotbugs:spotbugs --no-transfer-progress

      - name: Annotate with SpotBugs results
        if: always()
        run: python3 .github/scripts/annotate_spotbugs.py target/spotbugsXml.xml

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
